<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngetich K. Peter | Software Developer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8">

  <main class="max-w-3xl w-full space-y-8 my-auto">
    
    <!-- Profile Header -->
    <section class="bg-gray-900 border border-gray-800 rounded-lg p-6 text-center space-y-3">
      <div class="inline-block p-1 bg-gray-800 border border-gray-700 rounded-full mb-2">
        <div class="w-20 h-20 bg-gray-900 rounded-full flex items-center justify-center text-xl font-bold text-gray-200">
          NKP
        </div>
      </div>
      <h1 id="user-name" class="text-2xl font-bold tracking-tight text-white">Ngetich K. Peter</h1>
      <p id="user-handle" class="text-blue-400 font-mono text-sm">@ngetichkpeter</p>
      <p id="user-title" class="text-base font-medium text-gray-300">Full-Stack Software Developer</p>
      <p id="user-bio" class="text-gray-400 max-w-lg mx-auto text-sm leading-relaxed"></p>
    </section>

    <!-- Recent Updates / Logs -->
    <section class="space-y-4">
      <div class="flex items-center space-x-2 border-b border-gray-800 pb-2">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
        </svg>
        <h2 class="text-lg font-bold text-gray-200">System Logs & Updates</h2>
      </div>
      <div id="updates-container" class="space-y-3"></div>
    </section>

    <!-- Projects -->
    <section class="space-y-4">
      <div class="flex items-center space-x-2 border-b border-gray-800 pb-2">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 16l4-16M6 16l-4-16"></path>
        </svg>
        <h2 class="text-lg font-bold text-gray-200">Software Projects</h2>
      </div>
      <div id="projects-container" class="space-y-4"></div>
    </section>

    <!-- Social Connections -->
    <section class="space-y-4">
      <div class="flex items-center space-x-2 border-b border-gray-800 pb-2">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
        </svg>
        <h2 class="text-lg font-bold text-gray-200">Platform Connections</h2>
      </div>
      <div id="socials-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

  </main>

  <footer class="mt-12 text-gray-600 text-xs text-center border-t border-gray-900 pt-4 w-full max-w-3xl">
    Ngetich K. Peter &mdash; Software Engineer
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
